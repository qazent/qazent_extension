name: Build and deploy Node.js app to Azure Web App - qazent

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Install dependencies and build
        run: |
          rm -rf node_modules package-lock.json dist
          npm cache clean --force
          npm install
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            dist/
            package.json
            package-lock.json

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./deployment

      - name: List files for debugging
        run: ls -R ./deployment

      - name: Zip artifact for Azure
        run: |
          cd deployment
          zip -r ../app.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_559E80B8D164497A95657A13B532E769 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_64F5822EF7C941C2B63BE87ACE2923E5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_074E8BD9B9F2469B8ECDA3D36A4F7F02 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'qazent'
          slot-name: 'Production'
          package: app.zip
