deploy:
  runs-on: ubuntu-latest
  needs: build
  permissions:
    id-token: write
    contents: read

  steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: node-app
        path: .

    - name: List files for debugging
      run: ls -R .

    - name: Zip artifact
      run: zip -r app.zip dist

    - name: Login to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_559E80B8D164497A95657A13B532E769 }}
        tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_64F5822EF7C941C2B63BE87ACE2923E5 }}
        subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_074E8BD9B9F2469B8ECDA3D36A4F7F02 }}

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'qazent'
        slot-name: 'Production'
        package: app.zip
