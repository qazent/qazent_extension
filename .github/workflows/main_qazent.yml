name: Build and deploy Node.js backend to Azure Web App - qazent

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build:backend

      # OPTIONAL: build frontend if needed
      # - name: Build frontend
      #   run: npm run build:frontend

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: dist/backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3484D62D68CE4FA792C711032EB4403E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4FCFCA896B924C0EA78D38A7D009BBB9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4B48B771D2724B6D9C94BE665B844227 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'qazent'
          slot-name: 'Production'

          package: .
