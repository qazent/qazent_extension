trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

jobs:
- job: BuildAndPackageExtension
  displayName: "Build, Test, and Package Azure DevOps Extension"

  steps:
  - script: |
      npm install
    displayName: 'Install npm dependencies'

  - script: |
      npm install -g tfx-cli
    displayName: 'Install tfx-cli globally'

  - script: |
      npm run test:jest
    displayName: 'Run Jest tests'

  - script: |
      npm run lint
    displayName: 'Run TypeScript linting'

  - script: |
      npm run build
    displayName: 'Build extension package contents'

  - script: |
      npm run package:extension
    displayName: 'Package extension from dist root'

    

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/output/*.vsix'
      artifact: 'extension-package'
      publishLocation: 'pipeline'
    displayName: 'Publish .vsix artifact'

